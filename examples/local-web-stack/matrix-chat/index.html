<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Octos Matrix room</title>
  <style>
    :root { color-scheme:dark; --bg:#0b0f1a; --panel:#10182a; --border:#253451; --text:#e8eefb; --muted:#93a4c3; --accent:#6da8ff; }
    * { box-sizing:border-box; }
    body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,sans-serif; }
    header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--border); }
    header h1 { margin:0; font-size:17px; }
    .status { margin-left:auto; font-size:12px; color:var(--muted); }
    main { flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:10px; }
    .msg { max-width:72%; padding:9px 12px; border-radius:14px; border:1px solid var(--border); background:var(--panel); font-size:14px; line-height:1.5; white-space:pre-wrap; }
    .msg.me { align-self:flex-end; background:#17315f; }
    .msg .meta { display:block; font-size:11px; color:var(--muted); margin-bottom:3px; }
    footer { display:flex; gap:10px; padding:14px 20px 18px; border-top:1px solid var(--border); }
    textarea { flex:1; resize:none; height:52px; border-radius:12px; border:1px solid var(--border); background:#0d1422; color:var(--text); padding:12px 14px; font:inherit; }
    button { border:0; border-radius:12px; background:var(--accent); color:#04101f; font-weight:650; padding:0 22px; cursor:pointer; }
  </style>
</head>
<body>
  <header><h1>Octos Matrix room</h1><span class="status" id="status">connecting…</span></header>
  <main id="messages"></main>
  <footer><textarea id="input" placeholder="message octos…"></textarea><button id="send">send</button></footer>
  <script>
    // Same-origin: Caddy proxies /_matrix/* to Synapse, so no CORS setup is needed.
    const API = "/_matrix/client/v3";
    const USER = "REPLACE_WITH_MATRIX_USER";
    const PASSWORD = "REPLACE_WITH_MATRIX_PASSWORD";
    const ROOM = "REPLACE_WITH_ROOM_ID";
    const messagesEl = document.getElementById("messages");
    const statusEl = document.getElementById("status");
    const inputEl = document.getElementById("input");
    let token = localStorage.getItem("octos_matrix_token") || "";

    function renderEvent(event) {
      if (event.type !== "m.room.message") return;
      const sender = event.sender.split(":")[0].replace("@", "");
      const div = document.createElement("div");
      div.className = "msg" + (sender === USER ? " me" : "");
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = sender + " · " + new Date(event.origin_server_ts).toLocaleTimeString();
      div.append(meta, document.createTextNode(event.content.body || ""));
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function login() {
      const res = await fetch(API + "/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "m.login.password", identifier: { type: "m.id.user", user: USER }, password: PASSWORD }),
      });
      if (!res.ok) throw new Error("login " + res.status);
      token = (await res.json()).access_token;
      localStorage.setItem("octos_matrix_token", token);
    }

    async function start() {
      try {
        if (!token) await login();
        const hist = await fetch(`${API}/rooms/${encodeURIComponent(ROOM)}/messages?dir=b&limit=50`, { headers: { Authorization: "Bearer " + token } });
        if (!hist.ok) throw new Error("history " + hist.status);
        (await hist.json()).chunk.reverse().forEach(renderEvent);
        statusEl.textContent = "connected";
        syncLoop();
      } catch (e) { statusEl.textContent = "failed: " + e.message; }
    }

    async function syncLoop() {
      let since = localStorage.getItem("octos_matrix_since") || "";
      for (;;) {
        try {
          const res = await fetch(`${API}/sync?timeout=30000${since ? "&since=" + encodeURIComponent(since) : ""}`, { headers: { Authorization: "Bearer " + token } });
          if (res.status === 401) { await login(); continue; }
          if (!res.ok) throw new Error("sync " + res.status);
          const data = await res.json();
          since = data.next_batch;
          localStorage.setItem("octos_matrix_since", since);
          (data.rooms?.join?.[ROOM]?.timeline?.events || []).forEach(renderEvent);
        } catch { await new Promise((r) => setTimeout(r, 3000)); }
      }
    }

    document.getElementById("send").addEventListener("click", async () => {
      const body = inputEl.value.trim();
      if (!body) return;
      await fetch(`${API}/rooms/${encodeURIComponent(ROOM)}/send/m.room.message/${Date.now()}`, {
        method: "PUT",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ msgtype: "m.text", body }),
      });
      inputEl.value = "";
    });
    inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("send").click(); } });
    start();
  </script>
</body>
</html>
