[package]
name = "oh-my-octos"
version = "0.2.0"
edition = "2024"
description = "Curated defaults for Octos as a coding agent: discipline prompt, deterministic hooks, guided setup. One skill, one binary."
license = "Apache-2.0"
repository = "https://github.com/octos-org/oh-my-octos"
rust-version = "1.85"

[[bin]]
name = "oh-my-octos"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
portable-pty = "0.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Keep octos from absorbing this crate into a parent workspace when it builds
# the skill in place (`octos skills install` appends this line otherwise).
[workspace]
