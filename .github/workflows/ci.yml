name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: python3 -c "import json; json.load(open('manifest.json'))"
      - name: unit + hook contract tests (offline)
        run: cargo test
      - name: e2e compiles (runs only with a key, below)
        run: cargo test --test e2e --no-run

  e2e:
    # Real octos, real octoscode, real model. Runs only when the repository has a DEEPSEEK_API_KEY secret.
    name: e2e (macos)
    runs-on: macos-latest
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      OCTOS_VERSION: v2.0.3-rc.10
      OCTOSCODE_VERSION: v0.3.0-rc.9
    steps:
      - uses: actions/checkout@v4
      - name: skip without a key
        id: key
        run: |
          if [ -n "${{ secrets.DEEPSEEK_API_KEY }}" ]; then echo "present=1" >> "$GITHUB_OUTPUT"; else echo "present=0" >> "$GITHUB_OUTPUT"; echo "no DEEPSEEK_API_KEY secret; e2e skipped"; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.present == '1'
      - uses: Swatinem/rust-cache@v2
        if: steps.key.outputs.present == '1'
      - name: fetch octos and octoscode
        if: steps.key.outputs.present == '1'
        run: |
          mkdir -p "$RUNNER_TEMP/octos" "$RUNNER_TEMP/octoscode"
          curl -fsSL "https://github.com/octos-org/octos/releases/download/${OCTOS_VERSION}/octos-bundle-aarch64-apple-darwin.tar.gz" | tar xz -C "$RUNNER_TEMP/octos"
          curl -fsSL "https://github.com/octos-org/octoscode/releases/download/${OCTOSCODE_VERSION}/octoscode-aarch64-apple-darwin.tar.xz" | tar xJ -C "$RUNNER_TEMP/octoscode"
          "$RUNNER_TEMP/octos/octos" --version
          find "$RUNNER_TEMP/octoscode" -type f -name octoscode -perm -u+x | head -1 > "$RUNNER_TEMP/octoscode.path"
          "$(cat "$RUNNER_TEMP/octoscode.path")" --version
      - name: e2e
        if: steps.key.outputs.present == '1'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          export OCTOS_BIN="$RUNNER_TEMP/octos/octos"
          export OCTOSCODE_BIN="$(cat "$RUNNER_TEMP/octoscode.path")"
          cargo test --test e2e -- --test-threads=1 --nocapture
